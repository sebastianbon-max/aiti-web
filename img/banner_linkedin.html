<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Banner LinkedIn - aiTi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        .banner {
            width: 1128px;
            height: 191px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 40%, #0d1225 100%);
            position: relative;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* Grilla tech de fondo */
        .banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(78, 205, 196, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(78, 205, 196, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        /* Lineas decorativas tech */
        .line-1 {
            position: absolute;
            top: 50px;
            left: 200px;
            width: 300px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(78, 205, 196, 0.4), transparent);
        }
        .line-2 {
            position: absolute;
            bottom: 40px;
            right: 100px;
            width: 250px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(78, 205, 196, 0.3), transparent);
        }
        .dot-1 {
            position: absolute;
            top: 49px;
            left: 500px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4ECDC4;
            box-shadow: 0 0 8px rgba(78, 205, 196, 0.6);
        }
        .dot-2 {
            position: absolute;
            bottom: 39px;
            right: 350px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4ECDC4;
            box-shadow: 0 0 8px rgba(78, 205, 196, 0.6);
        }
        /* Contenido principal */
        .content {
            position: absolute;
            top: 50%;
            left: 63%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 50px;
        }
        .logo-text {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -2px;
            flex-shrink: 0;
        }
        .logo-text .ai { color: #ffffff; }
        .logo-text .t { color: #4ECDC4; }
        .logo-text .i { color: #ffffff; }
        .tagline {
            font-size: 30px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="line-1"></div>
        <div class="line-2"></div>
        <div class="dot-1"></div>
        <div class="dot-2"></div>
        <div class="content">
            <div class="logo-text">
                <span class="ai">ai</span><span class="t">T</span><span class="i">i</span>
            </div>
            <div class="tagline">Gestión Integral de Infraestructura IT</div>
        </div>
    </div>
</body>
</html>
